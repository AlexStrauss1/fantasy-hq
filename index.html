<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel2:#f0f3f9; --ink:#0f1626; --muted:#5f6b80; --line:#e2e7f0;
  --accent:#ff5a36; --accent2:#ff2f7a; --accent-ink:#fff; --good:#12a150; --ok:#c48a00; --bad:#e0412f; --chip:#eaeef6;
  --heat:255,90,54; --shadow:0 1px 2px rgba(15,22,38,.06),0 8px 24px rgba(15,22,38,.06); --side:#0f1626; --side-ink:#e9edf6; --side-muted:#8c97ad;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e18; --panel:#121827; --panel2:#182033; --ink:#eef2fa; --muted:#8e9ab2; --line:#222c42;
    --good:#34d07f; --ok:#f0bf47; --bad:#ff6a5a; --chip:#1d2639; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
    --side:#0d1220; --side-ink:#eef2fa; --side-muted:#7f8aa3;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e18; --panel:#121827; --panel2:#182033; --ink:#eef2fa; --muted:#8e9ab2; --line:#222c42;
  --good:#34d07f; --ok:#f0bf47; --bad:#ff6a5a; --chip:#1d2639; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --side:#0d1220; --side-ink:#eef2fa; --side-muted:#7f8aa3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px "Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:14px;color:#fff;box-shadow:0 6px 18px rgba(255,60,90,.35)}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.league-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}
.league-card .lname{font-size:12px;color:var(--side-muted);line-height:1.4}
.league-card label{color:var(--side-muted);margin:10px 0 4px}
.league-card select{width:100%;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:var(--side-ink)}
.league-card select option{color:#111}
#nav{display:flex;flex-direction:column;gap:2px}
.navh{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);margin:12px 10px 6px}
#nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);opacity:.78;padding:9px 10px;border-radius:10px;font:500 13.5px Inter,sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
#nav button:hover{background:rgba(255,255,255,.06);opacity:1}
#nav button.on{background:rgba(255,255,255,.1);opacity:1;font-weight:600}
#nav button .dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.2);flex:none}
#nav button.on .dot{background:var(--grad);box-shadow:0 0 0 3px rgba(255,90,54,.18)}
main{padding:28px 32px 90px;max-width:1360px;width:100%;min-width:0}
h2{font:700 26px/1.15 "Space Grotesk",Inter,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
h3{font:600 16px "Space Grotesk",Inter,sans-serif;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13.5px;max-width:880px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
button.btn,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.btn{cursor:pointer;font-weight:600;transition:transform .1s}
button.btn:active{transform:scale(.97)}
button.primary{background:var(--grad);color:var(--accent-ink);border:0;box-shadow:0 6px 16px rgba(255,60,90,.25)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);cursor:pointer;user-select:none;font-weight:700;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:11px;font-weight:600;color:var(--muted)}
.pos{display:inline-block;min-width:36px;text-align:center;padding:2px 6px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.QB{background:rgba(255,120,60,.16);color:#f0703a}.RB{background:rgba(30,190,110,.15);color:#1fae66}.WR{background:rgba(70,130,255,.15);color:#4f86ff}
.TE{background:rgba(190,80,240,.15);color:#b35ce8}.K{background:rgba(140,150,170,.18);color:#8592a8}.DST{background:rgba(100,120,150,.2);color:#7b8ba6}
.grade{display:inline-block;min-width:30px;text-align:center;border-radius:8px;font-weight:700;padding:2px 6px;font-size:12px}
.gA{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.gB{background:color-mix(in srgb,var(--good) 10%,transparent);color:var(--good)}
.gC{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.gD,.gF{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pr-card{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:start;transition:transform .15s}
.pr-card:hover{transform:translateY(-1px)}
.rank{font:700 30px/1 "Space Grotesk",sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rating{font:700 30px/1 "Space Grotesk",sans-serif;text-align:right}
.rating small{display:block;font:700 10px Inter,sans-serif;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.tname{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:12.5px}
.bars{display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
.blurb{font-size:13px;color:var(--muted);margin-top:4px}
.pos-good{color:var(--good)}.neg{color:var(--bad)}
.inj{color:var(--bad);font-weight:700;font-size:10.5px;margin-left:6px;letter-spacing:.02em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:6px 14px;font:600 12px Inter,sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13px}
.err{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.loading{padding:80px;text-align:center;color:var(--muted)}
.loading:before{content:"";display:block;width:28px;height:28px;margin:0 auto 14px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mu .r{text-align:right}
.pbar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.pbar>div{height:100%;background:var(--grad);border-radius:99px}
.big{font:700 26px/1.2 "Space Grotesk",sans-serif}
.stat .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--panel2)}
.pick label{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-weight:500;font-size:13px;padding:5px 6px;border-radius:8px;cursor:pointer}
.pick label:hover{background:var(--panel)}
.pick input{width:auto;accent-color:var(--accent)}
.verdict{font:700 22px "Space Grotesk",sans-serif;margin:4px 0}
a{color:var(--accent)}
.news{max-width:380px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.st-ACTIVE{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.st-QUESTIONABLE{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st-DOUBTFUL,.st-OUT,.st-SUSP,.st-IR{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
.timeline{display:grid;gap:14px}
.phase{display:grid;grid-template-columns:22px 1fr;gap:14px}
.phase .rail{display:flex;flex-direction:column;align-items:center}
.phase .node{width:14px;height:14px;border-radius:99px;border:3px solid var(--line);background:var(--panel);margin-top:20px}
.phase.now .node{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px rgba(255,90,54,.18)}
.phase.done{opacity:.55}
.phase .line{flex:1;width:2px;background:var(--line);margin-top:4px}
.todo{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.todo li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13.5px}
.todo li:before{content:"→";color:var(--accent);font-weight:700}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px}
  .league-card{order:3;width:100%;display:flex;gap:10px;align-items:center;padding:8px 10px}
  .league-card .lname{flex:1}.league-card label{display:none}.league-card select{width:auto;max-width:50%}
  #nav{order:4;flex-direction:row;overflow-x:auto;width:100%;gap:4px;padding-bottom:2px}
  .navh{display:none}
  main{padding:20px 16px 90px}
}
@media (max-width:640px){.pr-card{grid-template-columns:40px 1fr}.pr-card .rating{grid-column:2;text-align:left}.rank{font-size:24px}h2{font-size:22px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo">FH</span><span>Fantasy<b>HQ</b></span></div>
    <div class="league-card">
      <div class="lname" id="leagueLabel">Not connected</div>
      <label for="myTeam">My team</label><select id="myTeam"></select>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="loading">Loading…</div></main>
</div>

<script>
/* ---------- constants ---------- */
const SLOT={0:'QB',1:'TQB',2:'RB',3:'RB/WR',4:'WR',5:'WR/TE',6:'TE',7:'OP',16:'D/ST',17:'K',20:'BE',21:'IR',23:'FLEX'};
const POS={1:'QB',2:'RB',3:'WR',4:'TE',5:'K',16:'D/ST'};
const POSLIST=['QB','RB','WR','TE','K','D/ST'];
const START_ORDER=[0,2,4,6,17,16,3,5,23,7];
const PRO={0:'FA',1:'ATL',2:'BUF',3:'CHI',4:'CIN',5:'CLE',6:'DAL',7:'DEN',8:'DET',9:'GB',10:'TEN',11:'IND',12:'KC',13:'LV',14:'LAR',15:'MIA',16:'MIN',17:'NE',18:'NO',19:'NYG',20:'NYJ',21:'PHI',22:'ARI',23:'PIT',24:'LAC',25:'SF',26:'SEA',27:'TB',28:'WSH',29:'CAR',30:'JAX',33:'BAL',34:'HOU'};
const TEAM_ALIAS={WAS:'WSH',JAC:'JAX',LA:'LAR',OAK:'LV',LVR:'LV',SD:'LAC',GBP:'GB',KCC:'KC',NEP:'NE',NOS:'NO',SFO:'SF',TBB:'TB'};
const normTeam=a=>TEAM_ALIAS[a]||a;
const pkey=(pos,name,team)=>pos==='D/ST'||pos==='DEF'||pos==='DST'?'DEF|'+normTeam(team):pos+'|'+norm(name);
const SOURCES=[['espn','ESPN'],['slp','Sleeper'],['cbs','CBS'],['fp','FPros']];
const LAST_WEEK=17;
const NAV=[['This week',[['startsit','Start / Sit'],['proj','Weekly Projections'],['injuries','Injury Report'],['pickups','Pickups']]],
  ['Rest of season',[['plan','Season Plan'],['power','Power Rankings'],['ros','ROS Rankings'],['future','Future Trades'],['trade','Trade Analyzer']]],
  ['Data',[['players','Player Rankings'],['teams','Teams'],['settings','Settings']]]];

/* ---------- state ---------- */
const DEFAULT_RULES={passYd:.04,passTd:4,int:-2,rushYd:.1,rushTd:6,rec:1,recYd:.1,recTd:6,fl:-2};
const S={view:'power',season:2026,week:1,projWeek:1,teams:[],P:new Map(),src:{},status:{},sleeperIds:{},rules:{...DEFAULT_RULES},
  fp:{wk:new Map(),ros:new Map()},trend:new Map(),tv:new Map(),inj:new Map(),SC:{},scoring:'ppr',
  posTab:'ALL',avail:'all',sortKey:null,sortDir:-1,search:'',rankBy:'wk',demo:false,faab:null,schedule:[],
  trade:{a:null,b:null,ga:new Set(),gb:new Set()},leagueName:''};
const store={get(k,d){try{const v=localStorage.getItem('fhq_'+k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem('fhq_'+k,JSON.stringify(v))}catch{}}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>n==null||isNaN(n)?'—':(+n).toFixed(1);
const sgn=n=>(n>0?'+':'')+f1(n);
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))||1};
const z=(v,arr)=>(v-mean(arr))/sd(arr);
const norm=s=>String(s||'').toLowerCase().replace(/[.'’\-]/g,'').replace(/\s+(jr|sr|ii|iii|iv|v)$/,'').replace(/\s+/g,' ').trim();
const posCls=p=>p==='D/ST'?'DST':p;
const injTag=p=>{const I=S.inj.get(p.skey);return I?`<span class="inj" title="${esc(I.injury)}">${INJ_LABEL[I.code]}</span>`:''};
const posTag=p=>`<span class="pos ${posCls(p)}">${p}</span>`;
function erf(x){const t=1/(1+.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y}
const winProb=(a,b)=>.5*(1+erf((a-b)/28/Math.SQRT2));
const gradeOf=pct=>pct>=.9?'A+':pct>=.75?'A':pct>=.6?'B':pct>=.4?'C':pct>=.2?'D':'F';
const gradeTag=g=>`<span class="grade g${g[0]}">${g}</span>`;
function seeded(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
async function api(path,useAuth){
  const h={};
  if(useAuth){const s2=store.get('s2',''),sw=store.get('swid','');if(s2&&sw){h['X-ESPN-S2']=s2;h['X-ESPN-SWID']=sw}}
  const r=await fetch(path,{headers:h});const j=await r.json().catch(()=>({error:'Bad response'}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;
}

/* ---------- parsing ---------- */
function parsePlayer(pp){
  const pl=pp.player||pp; const pos=POS[pl.defaultPositionId]; if(!pos)return null;
  const yr=S.season, st={}; for(const s of pl.stats||[])st[s.id]=s;
  const espnWk={}; for(const w of range(S.week,LAST_WEEK)){const s=st['11'+yr+w]; if(s)espnWk[w]=s.appliedTotal||0}
  const season=st['00'+yr], seasonProj=st['10'+yr];
  const rt=S.scoring==='std'?'STANDARD':'PPR', rk=((pl.rankings||{})[S.week]||[]).filter(r=>r.rankType===rt);
  const cons=rk.find(r=>r.rankSourceId===0);
  const nfl=PRO[pl.proTeamId]||'FA';
  const skey=pkey(pos,pl.fullName,nfl);
  const seasonPts=season?.appliedTotal||0, avg=season?.appliedAverage||0;
  return {id:pl.id,name:pos==='D/ST'?pl.fullName:pl.fullName,pos,nfl,skey,slots:pl.eligibleSlots||[],
    inj:pl.injuryStatus&&pl.injuryStatus!=='ACTIVE'&&pl.injuryStatus!=='NORMAL'?pl.injuryStatus:(pl.injured?'INJ':''),
    own:pl.ownership?.percentOwned??0,ownChg:pl.ownership?.percentChange??0,
    espnWk,seasonPts,ppg:avg,gp:avg?Math.round(seasonPts/avg):0,seasonProj:seasonProj?.appliedTotal||0,
    expert:cons?.averageRank??null,nExperts:rk.filter(r=>r.rankSourceId!==0).length,
    teamId:pp.onTeamId||0,fa:pp.status||''};
}
function buildSleeper(arr){
  const key=S.scoring==='ppr'?'pts_ppr':S.scoring==='half'?'pts_half_ppr':'pts_std', m=new Map();
  for(const r of arr||[]){const p=r.player||{};if(!p.position)continue;
    const k=pkey(p.position,(p.first_name||'')+' '+(p.last_name||''),r.player_id);
    S.sleeperIds[r.player_id]=k;
    const v=r.stats?.[key]; if(v==null&&m.has(k))continue; m.set(k,{pts:v??null,opp:r.opponent})}
  return m;
}
// CBS publishes stat lines; score them with this league's rules so they're comparable
function buildCBS(arr){
  const R=S.rules,m=new Map();
  for(const r of arr||[]){const s=r.stats||{},g=k=>s[k]||0;
    const pts=r.pos==='K'?g('misc_fpts'):
      g('passing_yds')*R.passYd+g('passing_td')*R.passTd+g('passing_int')*R.int+g('rushing_yds')*R.rushYd+g('rushing_td')*R.rushTd+
      g('receiving_rec')*R.rec+g('receiving_yds')*R.recYd+g('receiving_td')*R.recTd+g('misc_fl')*R.fl;
    m.set(pkey(r.pos,r.name,r.team),{pts:+pts.toFixed(2)})}
  return m;
}
async function loadWeek(w){
  if(S.src[w]||w>LAST_WEEK)return;
  S.src[w]={slp:new Map(),cbs:new Map()};
  const [sl,cb]=await Promise.allSettled([api(`/api/sleeper?season=${S.season}&week=${w}`),api(`/api/cbs?season=${S.season}&week=${w}`)]);
  if(sl.status==='fulfilled')S.src[w].slp=buildSleeper(sl.value);
  if(cb.status==='fulfilled')S.src[w].cbs=buildCBS(cb.value);
  S.status[`Sleeper wk ${w}`]=S.src[w].slp.size; S.status[`CBS wk ${w}`]=S.src[w].cbs.size;
}
/* injuries: cross-reference ESPN news, CBS and Sleeper reports with ESPN Fantasy's own tag */
const SEV={ACTIVE:0,QUESTIONABLE:1,DOUBTFUL:2,OUT:3,SUSP:3,IR:4};
const INJ_LABEL={ACTIVE:'Active',QUESTIONABLE:'Questionable',DOUBTFUL:'Doubtful',OUT:'Out',SUSP:'Suspended',IR:'IR'};
function injCode(s){
  s=String(s||'').toLowerCase();
  if(!s)return null;
  if(s.includes('injured reserve')||s==='ir'||s.includes('injury_reserve')||s.includes('physically unable')||s==='pup'||s.includes('non-football'))return 'IR';
  if(s.includes('suspen'))return 'SUSP';
  if(s.startsWith('out')||s===' out'||s.includes('out for'))return 'OUT';
  if(s.includes('doubt'))return 'DOUBTFUL';
  if(s.includes('question')||s.includes('game time')||s.includes('gtd'))return 'QUESTIONABLE';
  if(s.includes('active')||s.includes('probable')||s==='normal')return 'ACTIVE';
  return null;
}
function dateToWeek(d){
  const start=new Date((S.seasonStart||`${S.season}-09-09`)+'T00:00:00'), t=new Date(d);
  if(isNaN(t))return null; return Math.max(1,Math.floor(((t-start)/864e5+1)/7)+1);
}
async function loadInjuries(){
  S.injRaw=null;

    const e=S.injRaw.byKey[k]||(S.injRaw.byKey[k]={});e[src]={...r,...extra}};
  S.injRaw.byKey={};
  for(const r of S.injRaw.espn)add('espn',r,{code:injCode(r.status),back:r.returnDate?dateToWeek(r.returnDate):null});
  for(const r of S.injRaw.cbs)add('cbs',r,{code:injCode(r.status),back:r.returnWeek});
  for(const r of S.injRaw.sleeper)add('slp',r,{code:injCode(r.status)});
  S.status['ESPN injury news']=S.injRaw.espn.length;S.status['CBS injury report']=S.injRaw.cbs.length;S.status['Sleeper injury status']=S.injRaw.sleeper.length;

}
function buildInjuries(){
  S.inj=new Map(); if(!S.injRaw)return;
  for(const p of S.P.values()){
    const e=S.injRaw.byKey[p.skey]||{}, fan=p.inj?{code:injCode(p.inj)||'QUESTIONABLE'}:null;
    const srcs={fan,espn:e.espn,cbs:e.cbs,slp:e.slp};
    const votes=Object.values(srcs).filter(x=>x&&x.code).map(x=>x.code);
    if(!votes.some(c=>c!=='ACTIVE'))continue;
    // majority vote; ties go to the more severe status
    const cnt={};votes.forEach(c=>cnt[c]=(cnt[c]||0)+1);
    const code=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||SEV[b]-SEV[a])[0];
    // return estimates only sideline players who are actually out; a questionable player's "return date" is just his next game
    const sidelined=['OUT','IR','SUSP'].includes(code);
    const backs=[e.espn?.back,e.cbs?.back].filter(x=>x&&x>S.week);
    let back=sidelined&&backs.length?Math.max(...backs):null;
    if(!back&&code==='OUT')back=S.week+1;
    S.inj.set(p.skey,{p,code,srcs,agree:new Set(votes).size===1,nSrc:votes.length,back,backs:{espn:e.espn?.back,cbs:e.cbs?.back},
      injury:e.cbs?.injury||e.espn?.injury||e.slp?.injury||'',practice:e.slp?.practice||'',note:e.espn?.note||e.slp?.notes||'',noteDate:e.espn?.date||''});
  }
}
// expected availability multiplier used in all projections
function injFactor(p,w){
  const I=S.inj.get(p.skey); if(!I)return 1;
  if(I.back&&w<I.back)return 0;
  if(w===S.week)return {OUT:0,IR:0,SUSP:0,DOUBTFUL:.25,QUESTIONABLE:.9}[I.code]??1;
  if(I.code==='IR'&&!I.back&&w<S.week+3)return 0;
  return 1;
}

/* ---------- projections ---------- */
function espnProj(p,w){return p.espnWk[w]??null}
function slpProj(p,w){return S.src[w]?.slp.get(p.skey)?.pts??null}
function cbsProj(p,w){return S.src[w]?.cbs.get(p.skey)?.pts??null}
function fpProj(p,w){return w===S.week?S.fp?.wk.get(p.skey)?.pts??null:null}
const srcProj={espn:espnProj,slp:slpProj,cbs:cbsProj,fp:fpProj};
function proj(p,w){
  // ESPN zeroes players on bye or ruled out; trust that over sources that still list them
  const e=espnProj(p,w); if(e===0&&p.inj&&p.inj!=='QUESTIONABLE')return 0;
  const v=SOURCES.map(([k])=>srcProj[k](p,w)).filter(x=>x!=null);
  return v.length?mean(v)*injFactor(p,w):0;
}
const srcRange=(p,w)=>{const v=SOURCES.map(([k])=>srcProj[k](p,w)).filter(x=>x!=null);return v.length?[Math.min(...v),Math.max(...v)]:[0,0]};
const nSrc=(p,w)=>SOURCES.filter(([k])=>srcProj[k](p,w)!=null).length;
const opp=(p,w)=>S.src[w]?.slp.get(p.skey)?.opp||'';
/* consensus rankings: mostly the average of the sites' own rankings, with our projection rank as a tiebreaker-weight voice */
const RANK_SITES={
  wk:[['espn','ESPN',p=>p.expert],['fp','FantasyPros',p=>p.fpEcr],['ds','Draft Sharks',p=>p.dsWk]],
  ros:[['fp','FantasyPros',p=>p.fpRos],['ds','Draft Sharks',p=>p.dsRos],['mkt','FantasyCalc',null]],
};
const PROJ_RANK_WEIGHT=.5;
function consensus(mode,w){
  const out=new Map(), byPos={};
  for(const p of S.P.values())(byPos[p.pos]=byPos[p.pos]||[]).push(p);
  // site rankings only exist for the current week; other weeks fall back to projections alone
  const sites=mode==='wk'&&w!==S.week?[]:RANK_SITES[mode];
  const val=mode==='wk'?p=>proj(p,w):p=>p.rosAvg;
  for(const arr of Object.values(byPos)){
    const sorted=arr.filter(p=>val(p)>0).sort((a,b)=>val(b)-val(a)), projRk=new Map(sorted.map((p,i)=>[p.id,i+1]));
    const vals=sorted.map(val), mkt=new Map(arr.filter(p=>p.tv>0).sort((a,b)=>b.tv-a.tv).map((p,i)=>[p.id,i+1]));
    const rankOf=(k,f,p)=>k==='mkt'?mkt.get(p.id)??null:f(p)??null;
    // how deep each site's list goes at this position (Draft Sharks publishes 25)
    const depth=Object.fromEntries(sites.map(([k,,f])=>[k,Math.max(0,...arr.map(p=>rankOf(k,f,p)||0))]));
    for(const p of arr){
      const parts=[];
      for(const [k,,f] of sites){const r=rankOf(k,f,p);if(r!=null)parts.push({k,r,w:1})}
      // a player other sites rank inside a list's range but that site leaves out is ranked just past its list
      const best=parts.length?Math.min(...parts.map(x=>x.r)):projRk.get(p.id);
      for(const [k] of sites)if(!parts.some(x=>x.k===k)&&depth[k]>=10&&best&&best<=depth[k]*.8)parts.push({k,r:depth[k]+3,w:1,missing:true});
      const pr=projRk.get(p.id);
      if(pr)parts.push({k:'proj',r:pr,w:parts.length?PROJ_RANK_WEIGHT:1});
      if(!parts.length)continue;
      const avg=parts.reduce((s,x)=>s+x.r*x.w,0)/parts.reduce((s,x)=>s+x.w,0);
      // to compare across positions, convert the rank to the points that rank is projected to score at that position
      const implied=vals.length?vals[Math.min(vals.length-1,Math.max(0,Math.round(avg)-1))]:0;
      out.set(p.id,{avg,implied,projRk:pr||null,nSites:parts.filter(x=>x.k!=='proj'&&!x.missing).length,parts});
    }
  }
  return out;
}
function optimal(roster,f){
  const used=new Set(),lineup=[];let total=0;
  for(const slot of START_ORDER){const n=S.SC[slot]||0;
    for(let i=0;i<n;i++){let best=null,bv=-1;
      for(const p of roster){if(used.has(p.id)||!p.slots.includes(slot))continue;const v=f(p);if(v>bv){bv=v;best=p}}
      if(best){used.add(best.id);total+=bv}lineup.push({slot,p:best,v:best?bv:0})}}
  return {total,lineup,bench:roster.filter(p=>!used.has(p.id))};
}
const rosterOf=t=>t.ids.map(id=>S.P.get(id)).filter(Boolean);
const rosLineup=roster=>optimal(roster,p=>p.rosAvg).total;

function recompute(){
  const weeks=range(S.week,LAST_WEEK);
  for(const p of S.P.values()){
    p.wk=proj(p,S.week); p.rosTotal=weeks.reduce((a,w)=>a+proj(p,w),0); p.rosAvg=p.rosTotal/weeks.length;
    const po=range(Math.max(S.week,(S.regEnd||14)+1),LAST_WEEK);
    p.poAvg=po.length?mean(po.map(w=>proj(p,w))):p.rosAvg;
  }
  // replacement level per position
  const n=S.teams.length||10, sc=S.SC, flexShare={QB:(sc[7]||0)*.9+(sc[1]||0),RB:(sc[23]||0)*.45+(sc[3]||0)*.5,WR:(sc[23]||0)*.45+(sc[3]||0)*.5+(sc[5]||0)*.7,TE:(sc[23]||0)*.1+(sc[5]||0)*.3,K:0,'D/ST':0};
  const ded={QB:sc[0]||0,RB:sc[2]||0,WR:sc[4]||0,TE:sc[6]||0,K:sc[17]||0,'D/ST':sc[16]||0};
  S.repl={};S.replWk={};
  for(const pos of POSLIST){
    const N=Math.max(1,Math.round(n*(ded[pos]+flexShare[pos])));
    const all=[...S.P.values()].filter(p=>p.pos===pos);
    const r=all.map(p=>p.rosAvg).sort((a,b)=>b-a), w=all.map(p=>p.wk).sort((a,b)=>b-a);
    S.repl[pos]=r[N]??0; S.replWk[pos]=w[N]??0;
  }
  for(const p of S.P.values())p.vor=p.rosAvg-S.repl[p.pos];
  S.crWk=consensus('wk',S.week); S.crRos=consensus('ros');
  // teams
  for(const t of S.teams){
    const ro=rosterOf(t);
    t.wkOpt=optimal(ro,p=>proj(p,S.week));
    t.wkProj=t.wkOpt.total;
    t.rosProj=mean(weeks.map(w=>optimal(ro,p=>proj(p,w)).total));
    const rl=optimal(ro,p=>p.rosAvg);
    t.posScore={};for(const pos of POSLIST)t.posScore[pos]=0;

    const gp=t.w+t.l+t.t||1; t.winPct=(t.w+t.t/2)/gp; t.ppg=t.pf/gp;

    const sorted=[...S.teams].sort((a,b)=>b.posScore[pos]-a.posScore[pos]);
    sorted.forEach((t,i)=>{t.posGrade=t.posGrade||{};t.posGrade[pos]=gradeOf(S.teams.length>1?1-i/(S.teams.length-1):1)});
  }

  const byWeek={};
  for(const m of S.schedule){if(!m.done)continue;(byWeek[m.wk]=byWeek[m.wk]||[]).push([m.h,m.hs],[m.a,m.as])}
  for(const t of S.teams){t.apW=0;t.apG=0}
  for(const arr of Object.values(byWeek))for(const [tid,s] of arr){const t=S.teams.find(x=>x.id===tid);if(!t)continue;
    for(const [o,os] of arr)if(o!==tid){t.apG++;if(s>os)t.apW++;else if(s===os)t.apW+=.5}}

  const A=k=>S.teams.map(t=>t[k]);

}

function blurb(t){
  const g=t.posGrade, strong=POSLIST.filter(p=>!['K','D/ST'].includes(p)&&g[p][0]==='A'), weak=POSLIST.filter(p=>!['K','D/ST'].includes(p)&&'DF'.includes(g[p][0]));
  const bits=[];
  if(strong.length)bits.push(`Strength at ${strong.join(', ')}.`);
  if(weak.length)bits.push(`Needs help at ${weak.join(', ')}.`);
  const luck=t.winPct-t.apPct;
  if(t.apG&&luck>.12)bits.push(`Record is better than the scoring (all-play ${(t.apPct*100).toFixed(0)}%) — some luck involved.`);
  if(t.apG&&luck<-.12)bits.push(`Unlucky so far: all-play ${(t.apPct*100).toFixed(0)}% says they deserve a better record.`);
  const rr=[...S.teams].sort((a,b)=>b.rosProj-a.rosProj).indexOf(t)+1;
  bits.push(`#${rr} rest-of-season roster by projections.`);
  const m=matchupFor(t.id,S.week);
  if(m){const o=team(m.h===t.id?m.a:m.h);if(o)bits.push(`Week ${S.week}: ${f1(t.wkProj)} vs ${esc(o.name)} (${f1(o.wkProj)}) — ${(winProb(t.wkProj,o.wkProj)*100).toFixed(0)}% to win.`)}
  return bits.join(' ');
}

function playerRows(){
  const w=S.projWeek, q=norm(S.search), ros=S.rankBy==='ros', multi=S.posTab==='ALL'||S.posTab==='FLEX';
  const cr=ros?S.crRos:(w===S.week?S.crWk:consensus('wk',w));
  let ps=[...S.P.values()].filter(p=>S.posTab==='ALL'||(S.posTab==='FLEX'?['RB','WR','TE'].includes(p.pos):p.pos===S.posTab));
  if(S.avail==='fa')ps=ps.filter(p=>!p.teamId); if(S.avail==='rost')ps=ps.filter(p=>p.teamId);
  const live=w===S.week;
  const rows=ps.map(p=>{const c=cr.get(p.id);return {p,name:p.name,pos:p.pos,nfl:p.nfl,opp:opp(p,w),owner:p.teamId?(team(p.teamId)?.name||''):(p.fa==='WAIVERS'?'Waivers':'Free agent'),
    avgRk:c?.avg??null,implied:c?.implied??0,nSites:c?c.nSites:null,projRk:c?.projRk??null,
    espn:espnProj(p,w),slp:slpProj(p,w),cbs:cbsProj(p,w),fp:fpProj(p,w),cons:proj(p,w),range:srcRange(p,w).map(f1).join('–'),
    expert:live?p.expert:null,fpEcr:live?p.fpEcr:null,dsWk:live?p.dsWk:null,fpGrade:live?p.fpGrade:'',fpRos:p.fpRos,dsRos:p.dsRos,tv:p.tv||null,adds:p.adds||null,
    rosAvg:p.rosAvg,rosTotal:p.rosTotal,seasonPts:p.seasonPts,ppg:p.ppg,own:p.own,ownChg:p.ownChg}});
  // one position: lowest average rank first; several positions: compare by the points each player's rank is worth at his position
  const has=r=>r.avgRk!=null;
  rows.sort((a,b)=>has(b)-has(a)||(multi?b.implied-a.implied||a.avgRk-b.avgRk:a.avgRk-b.avgRk)||b.cons-a.cons).forEach((r,i)=>r.rk=i+1);
  const k=S.sortKey;
  if(k&&k!=='rk')rows.sort((a,b)=>{const x=a[k],y=b[k];if(x==null||x==='')return 1;if(y==null||y==='')return -1;return(typeof x==='string'?x.localeCompare(y):x-y)*S.sortDir*(ASC_COLS.includes(k)?-1:1)});
  if(k==='rk'&&S.sortDir===1)rows.reverse();
  return q?rows.filter(r=>norm(r.name).includes(q)||norm(r.owner).includes(q)):rows;
}

function pickupData(){
  const my=team(S.my), ro=my?rosterOf(my):[], base=rosLineup(ro), baseWk=optimal(ro,p=>p.wk).total;
  const fas=[...S.P.values()].filter(p=>!p.teamId&&p.rosAvg>0);
  for(const p of fas){
    const rosOver=p.rosAvg-S.repl[p.pos], wkOver=p.wk-S.replWk[p.pos];
    // trend: ESPN ownership change + Sleeper adds in the last 48h
    const trend=Math.max(-10,Math.min(20,p.ownChg))*.25+Math.min(5,Math.log10(1+p.adds)*1.2);
    // FantasyPros rest-of-season expert rank vs. the number of starters at the position
    const N=Math.max(6,Math.round((S.teams.length||10)*({QB:1,RB:2.5,WR:2.5,TE:1,K:1,'D/ST':1}[p.pos])));
    const siteRk=S.crRos.get(p.id)?.nSites?S.crRos.get(p.id).avg:p.fpRos;
    const expert=siteRk?Math.max(-4,Math.min(6,(N*1.5-siteRk)/N*4)):-2;
    p.pkRaw=.45*rosOver+.2*wkOver+.2*expert+.15*trend; p.wkOver=wkOver; p.rosOver=rosOver;
  }
  // rank within the available pool, nudged by absolute value over replacement;
  // K and D/ST are rated in their own pool on a lower ceiling since they can be streamed
  const pool=(list,n,lo,hi)=>list.sort((a,b)=>b.pkRaw-a.pkRaw).slice(0,n).map((p,i,arr)=>{
    p.pkRating=Math.max(1,Math.min(hi,Math.round(lo+(hi-lo)*(1-i/Math.max(1,arr.length-1))+2*p.pkRaw)));return p});
  const isST=p=>['K','D/ST'].includes(p.pos);
  const top=[...pool(fas.filter(p=>!isST(p)),50,42,97),...pool(fas.filter(p=>p.pos==='K'),8,35,72),...pool(fas.filter(p=>p.pos==='D/ST'),8,35,72)];
  const dropCand=[...ro].sort((a,b)=>a.rosAvg-b.rosAvg);
  for(const p of top){
    p.gain=rosLineup([...ro,p])-base; p.gainWk=optimal([...ro,p],q=>q.wk).total-baseWk;
    p.drop=dropCand.find(d=>!['K','D/ST'].includes(d.pos)||d.pos===p.pos)||dropCand[0];
    const tags=[];
    if(p.pkRating>=85)tags.push('Must add');else if(p.pkRating>=75)tags.push('Strong add');
    if(p.wkOver>=2&&p.rosOver<1)tags.push('Streamer');
    if(p.ownChg>=3)tags.push('Trending ↑');
    if(p.gain>=1.5)tags.push('Fills your need');
    const I=S.inj.get(p.skey); if(I)tags.push(INJ_LABEL[I.code]+(I.back?` (back wk ${I.back})`:''));
    if(p.adds>=1000)tags.push(`${p.adds.toLocaleString()} Sleeper adds`);
    p.tags=tags;
  }
  return top;
}

function faabBid(r,pos){if(S.faab==null)return'';if(['K','D/ST'].includes(pos))return'$0–1';const pct=r>=88?[20,35]:r>=80?[10,20]:r>=72?[5,10]:r>=65?[2,5]:r>=58?[1,2]:[0,1];return `$${Math.round(S.faab*pct[0]/100)}–${Math.round(S.faab*pct[1]/100)}`}

/* trade analyzer */
function evalTrade(aId,bId,ga,gb){
  const A=team(aId),B=team(bId),ra=rosterOf(A),rb=rosterOf(B);
  const give=[...ga].map(id=>S.P.get(id)).filter(Boolean),get=[...gb].map(id=>S.P.get(id)).filter(Boolean);
  const na=[...ra.filter(p=>!ga.has(p.id)),...get],nb=[...rb.filter(p=>!gb.has(p.id)),...give];
  const dA=rosLineup(na)-rosLineup(ra),dB=rosLineup(nb)-rosLineup(rb);
  const wkA=optimal(na,p=>p.wk).total-optimal(ra,p=>p.wk).total,wkB=optimal(nb,p=>p.wk).total-optimal(rb,p=>p.wk).total;
  const val=ps=>ps.reduce((s,p)=>s+Math.max(0,p.vor)+p.rosAvg*.15,0);
  // where would each team land in ROS strength
  const ros=S.teams.map(t=>t.id===aId?rosLineup(na):t.id===bId?rosLineup(nb):rosLineup(rosterOf(t)));
  const rankAfter=v=>[...ros].sort((x,y)=>y-x).indexOf(v)+1, before=S.teams.map(t=>rosLineup(rosterOf(t)));
  const rankBefore=v=>[...before].sort((x,y)=>y-x).indexOf(v)+1;
  const mv=ps=>ps.reduce((s,p)=>s+(p.tv||0),0);
  return {A,B,give,get,dA,dB,wkA,wkB,valGive:val(give),valGet:val(get),mvGive:mv(give),mvGet:mv(get),
    rA:[rankBefore(rosLineup(ra)),rankAfter(rosLineup(na))],rB:[rankBefore(rosLineup(rb)),rankAfter(rosLineup(nb))],
    weeks:LAST_WEEK-S.week+1,extraA:Math.max(0,na.length-ra.length),extraB:Math.max(0,nb.length-rb.length)};
}
const tGrade=d=>d>=3?'A+':d>=1.5?'A':d>=.5?'B':d>=-.5?'C':d>=-2?'D':'F';
// key: which per-week value to optimize (rosAvg = rest of season, poAvg = playoff weeks)
function tradeFinder(key='rosAvg'){
  const lv=ro=>optimal(ro,p=>p[key]).total;
  const A=team(S.my); if(!A)return[];
  const ra=rosterOf(A), baseA=lv(ra), out=[];
  const mine=[...ra].sort((a,b)=>b[key]-a[key]).slice(0,14).filter(p=>!['K','D/ST'].includes(p.pos));
  for(const B of S.teams){if(B.id===A.id)continue;
    const rb=rosterOf(B),baseB=lv(rb),theirs=[...rb].sort((a,b)=>b[key]-a[key]).slice(0,14).filter(p=>!['K','D/ST'].includes(p.pos));
    const tryIt=(g,r)=>{const gs=new Set(g.map(p=>p.id)),rs=new Set(r.map(p=>p.id));
      const dA=lv([...ra.filter(p=>!gs.has(p.id)),...r])-baseA, dB=lv([...rb.filter(p=>!rs.has(p.id)),...g])-baseB;
      if(dA>.4&&dB>.1)out.push({B,g,r,dA,dB,score:Math.min(dA,dB*1.5)+dA*.5})};
    for(const g of mine)for(const r of theirs)tryIt([g],[r]);
    for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++)for(const r of theirs)tryIt([mine[i],mine[j]],[r]);
  }
  out.sort((a,b)=>b.score-a.score);
  const seen=new Set();return out.filter(o=>{const k=o.B.id+':'+o.r[0].id;if(seen.has(k))return false;seen.add(k);return true}).slice(0,12);
}

/* season simulation: playoff odds from projected lineups over the remaining schedule */
function gaussian(rnd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function simulateSeason(N=3000){
  const weeks=range(S.week,S.regEnd), T={};
  for(const t of S.teams){const ro=rosterOf(t);T[t.id]={};for(const w of weeks)T[t.id][w]=optimal(ro,p=>proj(p,w)).total}
  const games=S.schedule.filter(m=>!m.done&&m.wk>=S.week&&m.wk<=S.regEnd&&T[m.h]&&T[m.a]);
  const res=Object.fromEntries(S.teams.map(t=>[t.id,{po:0,top:0,wins:0}])), rnd=seeded(7);
  for(let i=0;i<N;i++){
    const W={},PF={};for(const t of S.teams){W[t.id]=t.w+t.t/2;PF[t.id]=t.pf}
    for(const m of games){const hs=T[m.h][m.wk]+gaussian(rnd)*22,as=T[m.a][m.wk]+gaussian(rnd)*22;PF[m.h]+=hs;PF[m.a]+=as;W[hs>as?m.h:m.a]++}
    const order=S.teams.map(t=>t.id).sort((a,b)=>W[b]-W[a]||PF[b]-PF[a]);
    order.forEach((id,k)=>{if(k<S.playoffTeams)res[id].po++;if(k===0)res[id].top++;res[id].wins+=W[id]});
  }
  for(const t of S.teams){const r=res[t.id];t.poOdds=r.po/N;t.topOdds=r.top/N;t.projWins=r.wins/N;t.gamesLeft=games.filter(m=>m.h===t.id||m.a===t.id).length}
}
const pct=x=>x==null?'—':`${Math.round(x*100)}%`;
const myT=()=>team(S.my)||S.teams[0];

/* rest-of-season rankings */
function rosRanked(pos){
  const multi=pos==='ALL';

    .map(p=>{const c=S.crRos.get(p.id);p.rkCons=c.avg;p.rkImplied=c.implied;p.rkProj=c.projRk;p.rkSites=c.nSites;
      p.rkMkt=c.parts.find(x=>x.k==='mkt'&&!x.missing)?.r??null;return p})
    .sort((a,b)=>multi?b.rkImplied-a.rkImplied||a.rkCons-b.rkCons:a.rkCons-b.rkCons||b.rosAvg-a.rosAvg);
}

/* future trades */
function deadlineInfo(){
  if(!S.deadlineWeek)return {txt:'No trade deadline found in your league settings',left:null,open:true};
  const left=S.deadlineWeek-S.week, d=S.deadlineDate?new Date(S.deadlineDate).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
  return {txt:left<0?`Trade deadline passed (week ${S.deadlineWeek})`:`Trade deadline: week ${S.deadlineWeek}${d?` (${d})`:''} — ${left===0?'this week':left+' week'+(left>1?'s':'')+' left'}`,left,open:left>=0};
}
function buySell(){
  const skill=p=>['QB','RB','WR','TE'].includes(p.pos);
  const healthy=p=>{const I=S.inj.get(p.skey);return !I||!I.back||I.back<=S.week+2};
  const buy=[...S.P.values()].filter(p=>skill(p)&&p.teamId&&p.teamId!==S.my&&p.gp>=3&&healthy(p)&&p.rosAvg-p.ppg>=1.5&&p.vor>0)
    .sort((a,b)=>(b.rosAvg-b.ppg)+b.vor*.3-((a.rosAvg-a.ppg)+a.vor*.3)).slice(0,10);
  // elite players (FantasyPros top 5 at the position) are keepers even when they've run hot
  const sell=[...S.P.values()].filter(p=>skill(p)&&p.teamId===S.my&&p.gp>=3&&p.ppg-p.rosAvg>=1.5&&p.ppg>=8&&!(p.fpRos&&p.fpRos<=5))
    .sort((a,b)=>(b.ppg-b.rosAvg)-(a.ppg-a.rosAvg)).slice(0,8);
  const poPlus=[...S.P.values()].filter(p=>skill(p)&&p.teamId!==S.my&&p.poAvg-p.rosAvg>=1.2&&p.vor>-1).sort((a,b)=>(b.poAvg-b.rosAvg)-(a.poAvg-a.rosAvg)).slice(0,8);
  const poMinus=[...S.P.values()].filter(p=>skill(p)&&p.teamId===S.my&&p.rosAvg-p.poAvg>=1.2).sort((a,b)=>(b.rosAvg-b.poAvg)-(a.rosAvg-a.poAvg)).slice(0,6);
  return {buy,sell,poPlus,poMinus};
}

/* season plan */
function seasonAdvice(){
  const t=myT(), ro=rosterOf(t), W=S.week, adv={holes:[],cuffs:[],stash:[]};
  for(const w of range(W+1,Math.min(S.regEnd,LAST_WEEK))){
    const o=optimal(ro,p=>proj(p,w)), weak=o.lineup.filter(l=>!l.p||l.v<2);
    if(weak.length)adv.holes.push({w,slots:weak.map(l=>SLOT[l.slot]),total:o.total});
  }
  const rb=optimal(ro,p=>p.rosAvg).lineup.filter(l=>l.p&&l.p.pos==='RB').map(l=>l.p);
  for(const p of rb){
    const c=[...S.P.values()].filter(q=>q.pos==='RB'&&q.nfl===p.nfl&&q.id!==p.id).sort((a,b)=>b.seasonProj-a.seasonProj)[0];
    if(c)adv.cuffs.push({star:p,cuff:c,mine:c.teamId===t.id,free:!c.teamId});
  }
  adv.stash=[...S.inj.values()].filter(i=>!i.p.teamId&&i.back&&i.back>W&&i.back<=S.regEnd+1&&i.p.poAvg>S.repl[i.p.pos]+1).sort((a,b)=>b.p.poAvg-a.p.poAvg).slice(0,5);
  return adv;
}
function vPlan(){
  const t=myT(), W=S.week, dl=deadlineInfo(), adv=seasonAdvice(), standings=[...S.teams].sort((a,b)=>b.poOdds-a.poOdds||b.projWins-a.projWins);
  const ro=rosterOf(t), o=optimal(ro,p=>proj(p,W)), cur=ro.filter(p=>p.slotNow!=null&&![20,21].includes(p.slotNow)), curIds=new Set(cur.map(p=>p.id));
  const changes=cur.length?o.lineup.filter(l=>l.p&&!curIds.has(l.p.id)).length:null;
  const pk=pickupData().filter(p=>!['K','D/ST'].includes(p.pos)).sort((a,b)=>b.gain-a.gain)[0];
  const myInj=[...S.inj.values()].filter(i=>i.p.teamId===t.id&&injFactor(i.p,W)===0);
  const injStart=myInj.filter(i=>i.p.slotNow!=null&&![20,21].includes(i.p.slotNow)), toIR=myInj.filter(i=>i.p.slotNow===20&&['IR','OUT'].includes(i.code));
  const weakPos=POSLIST.filter(p=>!['K','D/ST'].includes(p)&&'DF'.includes(t.posGrade[p][0]));
  const bs=buySell(), po=range(S.regEnd+1,LAST_WEEK);
  const phase=(state,title,when,items)=>`<div class="phase ${state}"><div class="rail"><div class="node"></div><div class="line"></div></div>
    <div class="card"><div class="row"><h3 style="margin:0;flex:1">${title}</h3><span class="chip">${when}</span>${state==='now'?'<span class="chip" style="background:var(--grad);color:#fff">Now</span>':''}</div><ul class="todo">${items.filter(Boolean).map(x=>`<li><span>${x}</span></li>`).join('')}</ul></div></div>`;
  const mode=t.poOdds>=.7?'contender':t.poOdds>=.3?'bubble':'longshot';
  const dlState=dl.left==null||dl.left>=0?(W<=(S.deadlineWeek??W)?'':'done'):'done';
  return `<h2>Season Plan</h2><p class="sub">Your playoff odds come from simulating the rest of the regular season 3,000 times with each team's projected best lineup. The timeline below turns that into what to do at each stage of the season.</p>
  <div class="grid g4" style="margin-bottom:20px">
    <div class="card stat"><div class="label">Playoff odds</div><div class="big">${pct(t.poOdds)}</div><div class="pbar"><div style="width:${Math.round((t.poOdds||0)*100)}%"></div></div><div class="meta" style="margin-top:6px">Top ${S.playoffTeams} make it</div></div>
    <div class="card stat"><div class="label">Projected record</div><div class="big">${f1(t.projWins)} W</div><div class="meta">Now ${rec(t)} · ${t.gamesLeft} games left</div></div>
    <div class="card stat"><div class="label">#1 seed odds</div><div class="big">${pct(t.topOdds)}</div><div class="meta">Power rank #${t.rank}</div></div>

  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start">
  <div class="timeline">
    ${phase('now',`This week`,`Week ${W}`,[
      changes==null?`Set your lineup from <a href="#" onclick="go('startsit');return false">Start / Sit</a> — best lineup projects ${f1(o.total)} pts.`:changes?`Make ${changes} lineup change${changes>1?'s':''} — see <a href="#" onclick="go('startsit');return false">Start / Sit</a> (+${f1(o.total-cur.reduce((s,p)=>s+proj(p,W),0))} pts).`:`Your lineup is already optimal (${f1(o.total)} projected).`,
      injStart.length?`Bench injured starters: ${injStart.map(i=>`<b>${esc(i.p.name)}</b> (${INJ_LABEL[i.code]}${i.back?`, back wk ${i.back}`:''})`).join(', ')}.`:'',
      toIR.length&&S.SC[21]?`Move to an IR slot to free a roster spot: ${toIR.map(i=>`<b>${esc(i.p.name)}</b>${i.back?` (back wk ${i.back})`:''}`).join(', ')}.`:'',
      pk&&pk.gain>0.3?`Best waiver add for your lineup: <b>${esc(pk.name)}</b> (${pk.pos}, +${f1(pk.gain)} pts/wk)${pk.drop?` — drop ${esc(pk.drop.name)}`:''}.`:'',
    ])}

      mode==='contender'?'Consolidate: trade two good players for one great one — your bench matters less than your starters now.':mode==='bubble'?`Upgrade your weakest spot${weakPos.length?` (${weakPos.join(', ')})`:''} — every win in the next few weeks counts.`:'Swing big: target high-upside starters and injured stars who return before the playoffs.',
      bs.buy[0]?`Buy-low targets: ${bs.buy.slice(0,3).map(p=>`<b>${esc(p.name)}</b> (${esc(team(p.teamId)?.abbrev||'')})`).join(', ')}.`:'',

      `Run the finder in <a href="#" onclick="go('future');return false">Future Trades</a> for deals both sides should accept.`,
    ]):''}
    ${phase(W>S.regEnd?'done':'',`Playoff push`,`Weeks ${Math.max(W+1,(S.deadlineWeek||W)+1)}–${S.regEnd}`,[
      adv.holes.length?`Bye-week holes: ${adv.holes.slice(0,4).map(h=>`<b>week ${h.w}</b> (${h.slots.join(', ')})`).join('; ')}. Add a streamer the week before.`:'No bye-week holes in your lineup for the rest of the regular season.',
      adv.stash.length?`Stash injured players returning before the playoffs: ${adv.stash.slice(0,3).map(i=>`<b>${esc(i.p.name)}</b> (back wk ${i.back})`).join(', ')}.`:'',
      'Keep your waiver priority / FAAB for injuries to your starters — don\'t spend it all on depth.',

    ${phase(W>LAST_WEEK?'done':'',`Fantasy playoffs`,`Weeks ${po[0]}–${po[po.length-1]}`,[
      adv.cuffs.filter(c=>!c.mine).length?`Protect your RBs with handcuffs: ${adv.cuffs.filter(c=>!c.mine).map(c=>`<b>${esc(c.cuff.name)}</b> backs up ${esc(c.star.name)} (${c.free?'available':'on '+esc(team(c.cuff.teamId)?.name||'')})`).join('; ')}.`:'Your top RBs already have their handcuffs covered.',
      bs.poMinus.length?`Your weaker playoff schedules: ${bs.poMinus.slice(0,3).map(p=>`<b>${esc(p.name)}</b> (${f1(p.poAvg)} vs ${f1(p.rosAvg)} usual)`).join(', ')}.`:'',
      `Week ${LAST_WEEK}: NFL teams that have clinched may rest starters — check news before kickoff and keep a backup at each spot.`,
      'Start/sit by matchup, not name — use the Low–High range and the injury report each week.',

  </div>
  <div><div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="num">Record</th><th class="num">Proj W</th><th class="num">Playoffs</th></tr></thead><tbody>

  </tbody></table></div></div></div>`;
}

      <li><b>Consensus</b> projection = average of every site that has the player, then adjusted for injury status.</li>
      <li>Data refreshes every 10 minutes (Sleeper's player file every 6 hours); reload the page to pull new numbers.</li>
    </ul>
    <b>Loaded right now</b>
    <div class="meta" style="margin-top:4px">${Object.entries(S.status).map(([k,v])=>`${esc(k)}: <b class="${v?'':'neg'}">${v?v.toLocaleString():'unavailable'}</b>`).join('<br>')}${S.fpDate?`<br>FantasyPros updated ${esc(S.fpDate)}`:''}</div>
    </div></div>`;
}
function saveSettings(){
  store.set('leagueId',$('#lid').value.trim().replace(/\D/g,''));store.set('season',+$('#season').value||2026);
  const s2=$('#s2')?.value.trim(),sw=$('#swid')?.value.trim();store.set('s2',s2||'');store.set('swid',sw||'');
  S.view='power';loadLeague();
}
loadLeague();
</script>
